name: Sync upstream and release

on:
  schedule:
    # 每 2 小时检查一次
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '强制从指定 tag 同步（留空则自动检测上游最新）'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-v2rayn
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check upstream latest release
        id: check
        run: |
          set -euo pipefail

          MANUAL_TAG="${{ github.event.inputs.upstream_tag || '' }}"

          fetch_release() {
            local url="$1"
            curl -sSL -w "\n%{http_code}" \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github.v3+json" \
                      -H "User-Agent: GitHub-Actions-Sync" \
                      "$url"
          }

          if [ -n "$MANUAL_TAG" ]; then
            RAW_RESP=$(fetch_release "https://api.github.com/repos/2dust/v2rayN/releases/tags/$MANUAL_TAG" || true)
          else
            RAW_RESP=$(fetch_release "https://api.github.com/repos/2dust/v2rayN/releases?per_page=1" || true)
          fi

          HTTP_CODE=$(printf '%s' "$RAW_RESP" | tail -n1)
          RESP_BODY=$(printf '%s' "$RAW_RESP" | sed '$d')

          if [ "$HTTP_CODE" != "200" ] || ! printf '%s' "$RESP_BODY" | jq -e . >/dev/null 2>&1; then
            echo "::warning::获取上游 release 失败 (HTTP $HTTP_CODE)，跳过本次同步"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$MANUAL_TAG" ]; then
            UPSTREAM_RELEASE="$RESP_BODY"
          else
            UPSTREAM_RELEASE=$(printf '%s' "$RESP_BODY" | jq -c '.[0] // empty')
          fi

          UPSTREAM_TAG=$(printf '%s' "$UPSTREAM_RELEASE" | jq -r '.tag_name // empty')
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "上游最新版（含 prerelease）: $UPSTREAM_TAG"

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::warning::无法解析上游 tag_name，跳过本次同步"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          UPSTREAM_BODY=$(printf '%s' "$UPSTREAM_RELEASE" | jq -r '.body // ""')
          UPSTREAM_PRERELEASE=$(printf '%s' "$UPSTREAM_RELEASE" | jq -r '.prerelease // false')
          echo "upstream_prerelease=$UPSTREAM_PRERELEASE" >> "$GITHUB_OUTPUT"

          printf '%s' "$UPSTREAM_BODY" > /tmp/release_body.txt
          echo "上游 prerelease: $UPSTREAM_PRERELEASE"

          MOD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$UPSTREAM_TAG")

          if [ "$MOD_STATUS" == "200" ]; then
            echo "::notice::Mod 仓库已有 $UPSTREAM_TAG release，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::发现新版本 $UPSTREAM_TAG，开始同步"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout mod repo
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Sync upstream code
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"

          # 1. 只备份我们自己的 sync-upstream.yml
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml.bak

          # 2. 添加上游 remote 并强制拉取
          git remote add upstream https://github.com/2dust/v2rayN.git 2>/dev/null \
            || git remote set-url upstream https://github.com/2dust/v2rayN.git
          git fetch upstream --tags --force

          # 3. 配置 Git 提交信息
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 4. 重置到上游最新 Tag（完整保留上游最新的 build-*.yml、package-zip.yml、upload-sign.yml 等）
          git reset --hard "$UPSTREAM_TAG"

          # 5. 恢复本地 sync-upstream.yml
          cp /tmp/sync-upstream.yml.bak .github/workflows/sync-upstream.yml

          # 6. 删除不需要的杂项 workflow（保留 build.yml 和 build-WebAPI.yml 供发布流程调用）
          rm -f .github/workflows/test.yml \
                .github/workflows/winget-publish.yml \
                .github/workflows/update-cert.yml

          # 7. 跳过 build-WebAPI.yml 的 git diff --check，避免 force push 导致找不到旧提交报错
          if [ -f ".github/workflows/build-WebAPI.yml" ]; then
            sed -i 's/git diff --check/echo skip git diff --check/g' .github/workflows/build-WebAPI.yml
          fi

          echo "✅ 已同步上游最新构建脚本，并保留本地 sync-upstream.yml"

      - name: Remove promotion code
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import sys

          def read_file(file_path):
              with open(file_path, 'r', encoding='utf-8') as f:
                  return f.readlines()

          def write_file(file_path, lines):
              with open(file_path, 'w', encoding='utf-8') as f:
                  f.writelines(lines)

          def remove_lines_containing(lines, text):
              return [line for line in lines if text not in line]

          def replace_in_lines(lines, old, new):
              return [line.replace(old, new) for line in lines]

          def remove_method_block(lines, method_signature):
              final_lines = []
              skip_block = False
              for line in lines:
                  if method_signature in line:
                      skip_block = True
                      continue
                  if skip_block:
                      if line.strip() == '}':
                          skip_block = False
                          continue
                  if not skip_block:
                      final_lines.append(line)
              return final_lines

          def remove_xml_block(lines, identifier):
              result_lines = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if identifier in line:
                      if '/>' in line:
                          start = i
                          while start > 0 and '<MenuItem' not in lines[start]:
                              start -= 1
                          i += 1
                          continue
                      else:
                          start = i
                          while start > 0 and '<MenuItem' not in lines[start]:
                              start -= 1
                          end = i
                          while end < len(lines) and '</MenuItem>' not in lines[end]:
                              end += 1
                          if end < len(lines):
                              end += 1
                          while len(result_lines) > 0 and result_lines[-1] == lines[start]:
                              result_lines.pop()
                              start += 1
                          i = end
                          continue
                  result_lines.append(line)
                  i += 1
              return result_lines

          def remove_menu_block(lines, identifier):
              start_index = -1
              end_index = -1
              for i, line in enumerate(lines):
                  if identifier in line:
                      start_index = i
                      while start_index >= 0 and '<Menu' not in lines[start_index].strip():
                          start_index -= 1
                      end_index = i
                      while end_index < len(lines):
                          if '<Separator' in lines[end_index]:
                              end_index += 1
                              break
                          end_index += 1
                      break
              if start_index >= 0 and end_index >= 0:
                  return lines[:start_index] + lines[end_index:]
              return lines

          def remove_duplicate_menu_lines(lines):
              result_lines = []
              prev_line = None
              for line in lines:
                  if line.strip() != prev_line:
                      result_lines.append(line)
                      prev_line = line.strip()
              return result_lines

          # 自动适配 v2rayN 8.x 新路径 (v2rayN.Windows) 与旧路径 (v2rayN)
          wpf_dir = 'v2rayN/v2rayN.Windows' if os.path.exists('v2rayN/v2rayN.Windows') else 'v2rayN/v2rayN'

          operations = {
              'v2rayN/ServiceLib/Global.cs': [
                  ('remove_lines', 'public const string PromotionUrl'),
                  ('replace', '"2dust/v2rayN"', '"91fabu/v2rayN-noAD"'),
              ],
              'v2rayN/v2rayN.Desktop/Views/MainWindow.axaml': [
                  ('remove_xml', 'x:Name="menuPromotion"')
              ],
              'v2rayN/v2rayN.Desktop/Views/MainWindow.axaml.cs': [
                  ('remove_lines', 'menuPromotion.Click += MenuPromotion_Click;'),
                  ('remove_method', 'private void MenuPromotion_Click')
              ],
              f'{wpf_dir}/Views/MainWindow.xaml': [
                  ('remove_menu', 'x:Name="menuPromotion"'),
                  ('remove_duplicate_menu', None)
              ],
              f'{wpf_dir}/Views/MainWindow.xaml.cs': [
                  ('remove_lines', 'menuPromotion.Click += MenuPromotion_Click;'),
                  ('remove_method', 'private void MenuPromotion_Click')
              ]
          }

          success = 0
          total = len(operations)

          for rel_path, ops in operations.items():
              if not os.path.exists(rel_path):
                  print(f"::error::文件不存在: {rel_path}")
                  continue
              try:
                  lines = read_file(rel_path)
                  for op in ops:
                      op_type = op[0]
                      text = op[1]
                      if op_type == 'remove_lines':
                          lines = remove_lines_containing(lines, text)
                      elif op_type == 'remove_method':
                          lines = remove_method_block(lines, text)
                      elif op_type == 'remove_xml':
                          lines = remove_xml_block(lines, text)
                      elif op_type == 'replace':
                          lines = replace_in_lines(lines, text, op[2])
                      elif op_type == 'remove_menu':
                          lines = remove_menu_block(lines, text)
                      elif op_type == 'remove_duplicate_menu':
                          lines = remove_duplicate_menu_lines(lines)
                  write_file(rel_path, lines)
                  success += 1
                  print(f"✅ {rel_path}")
              except Exception as e:
                  print(f"::error::{rel_path}: {e}")

          print(f"\n处理完成: {success}/{total}")
          if success < total:
              print("::error::部分文件去推广处理失败，中止发布以防流出带推广版本")
              sys.exit(1)
          PYTHON_SCRIPT

      - name: Modify README
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ -f "README.md" ]; then
            sed -i 's@2dust/v2rayN@91fabu/v2rayN-noAD@g' README.md
            sed -i 's/7694 5E9F 3E9A 168F 8070 F195 805D 661C/19E510A17937965AED7AB23DCC29C3F55BC19F3D/g' README.md
            sed -i '/134D FAF6 8903 C199 463C 31E5 AE90 3AE0/d' README.md

            python3 -c '
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()
          notice = "<div align=\"center\">\n  <h2 style=\"color: #d73a49; font-weight: bold;\">⚠️ 本项目为 v2rayN 去广告、去推广修改版 (Mod)</h2>\n  <p><strong>已移除商业推广入口及相关推广链接，保持与上游自动同步构建。</strong></p>\n</div>\n\n---\n\n"
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(notice + content)
          '
            sed -i 's/[[:space:]]*$//' README.md
            echo "✅ 已更新 README.md"
          else
            echo "⚠️ 未找到 README.md，跳过修改"
          fi

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"

          git add -A
          if git diff --cached --quiet; then
            echo "::notice::工作树无变化，跳过 commit"
          else
            git commit -m "Sync upstream $UPSTREAM_TAG - Remove promotions and sync workflows"
          fi

          git push --force origin master
          git tag -f "$UPSTREAM_TAG"
          git push --force origin "$UPSTREAM_TAG"

      - name: Create release with upstream info
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"
          UPSTREAM_PRERELEASE="${{ steps.check.outputs.upstream_prerelease }}"

          export UPSTREAM_TAG UPSTREAM_PRERELEASE
          python3 << 'PYEOF'
          import json, os

          upstream_body = open('/tmp/release_body.txt').read().strip()

          macos_note = (
              "\n\n"
              "---\n"
              "### macOS 用户注意\n\n"
              "如果打开 app 时提示「无法打开」或「移到废纸篓」，请在终端执行：\n\n"
              "```bash\n"
              "# 方法一：移除隔离属性（推荐）\n"
              "xattr -cr /Applications/v2rayN.app\n\n"
              "# 方法二：重新签名\n"
              "codesign --force --deep --sign - /Applications/v2rayN.app\n"
              "```\n"
          )

          body = upstream_body + macos_note

          payload = {
              'tag_name': os.environ['UPSTREAM_TAG'],
              'target_commitish': 'master',
              'name': '',
              'body': body,
              'draft': False,
              'prerelease': os.environ['UPSTREAM_PRERELEASE'] == 'true'
          }
          with open('/tmp/release_payload.json', 'w') as f:
              json.dump(payload, f)
          PYEOF

          echo "预创建 release $UPSTREAM_TAG (prerelease=$UPSTREAM_PRERELEASE)"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d @/tmp/release_payload.json

          echo "✅ Release 已创建，信息与上游一致"

      - name: Trigger build-all workflow
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"

          echo "触发 build-all.yml，release_tag=$UPSTREAM_TAG"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-all.yml/dispatches" \
            -d '{"ref":"master","inputs":{"release_tag":"'"$UPSTREAM_TAG"'"}}'

          echo "✅ 构建已触发，版本: $UPSTREAM_TAG"
